
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aiot-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./MOSQUITTO/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - aiot_network
    restart: unless-stopped

  backend:
    build: ./BACKEND
    container_name: aiot-backend
    environment:
      DATABASE_PATH: /app/data/aiot.db
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sqlite_data:/app/data
    depends_on:
      mosquitto:
        condition: service_started
    networks:
      - aiot_network
    restart: unless-stopped

networks:
  aiot_network:
    driver: bridge

volumes:
  sqlite_data:
  mosquitto_data:
  mosquitto_log:
